name: Cloudflare Pages PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test reservations with coverage
        run: npm run test:reservas:coverage

      - name: Test Cloudflare preview cleanup
        run: npm run test:cloudflare-cleanup

      - name: Test reservation recovery drill
        run: npm run test:reservas:recovery

      - name: Build
        run: npm run build

      # GitHub intentionally withholds repository secrets from forked pull
      # requests. Those PRs still run the complete build above, but cannot deploy.
      - name: Apply preview D1 migrations
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Verify preview D1 migration
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-migracion.sql

      - name: Verify preview accommodation inventory
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-inventario.sql

      - name: Verify preview capacity rules
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-capacidad.sql

      - name: Verify preview security controls
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-seguridad.sql

      - name: Verify preview pricing rules
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-tarifas.sql

      - name: Verify preview operational occupancy
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=scripts/reservas/verificar-ocupacion-operativa.sql

      - name: Deploy Cloudflare Pages preview
        id: deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=pueblo-magico-web --branch=pr-${{ github.event.pull_request.number }}

      - name: Add preview link to pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            if (!previewUrl) {
              core.setFailed('Cloudflare did not return a preview URL.');
              return;
            }
            const body = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `Preview: ${previewUrl}`,
              '',
              'Database: shared preview D1 `magico-ensueno-db-preview`.',
              '',
              `Updated from commit \`${context.sha.slice(0, 7)}\`.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Smoke test preview security
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          correlation_id="smoke-wreserv-10-${{ github.event.pull_request.number }}"
          for attempt in {1..12}; do
            availability_status=$(curl --silent --show-error --max-time 15 --output /tmp/disponibilidad.json --write-out '%{http_code}' "$PREVIEW_URL/api/disponibilidad?desde=2026-11-10&hasta=2026-11-13" || true)
            admin_status=$(curl --silent --show-error --max-time 15 --output /tmp/admin-me.json --write-out '%{http_code}' "$PREVIEW_URL/api/admin/me" || true)
            reservations_status=$(curl --silent --show-error --max-time 15 --dump-header /tmp/admin-reservas.headers --output /tmp/admin-reservas.json --write-out '%{http_code}' --header "X-Request-ID: $correlation_id" "$PREVIEW_URL/api/admin/reservas" || true)

            if test "$availability_status" = "200" \
              && test "$admin_status" = "401" \
              && test "$reservations_status" = "401" \
              && grep --ignore-case --quiet "^x-request-id: $correlation_id" /tmp/admin-reservas.headers; then
              break
            fi

            if test "$attempt" = "12"; then
              echo "Availability response ($availability_status):"
              cat /tmp/disponibilidad.json
              echo "Admin session response ($admin_status):"
              cat /tmp/admin-me.json
              echo "Admin reservations response ($reservations_status):"
              cat /tmp/admin-reservas.headers
              cat /tmp/admin-reservas.json
              echo 'Preview alias did not converge to the deployment with the expected API and security middleware.'
              exit 1
            fi

            echo "Waiting for Cloudflare preview alias propagation (attempt $attempt/12; availability=$availability_status, admin=$admin_status, reservations=$reservations_status)."
            sleep 10
          done
