name: Provision Reservas DEV Pages project (one-time)

# One-time operations branch; never deploy, migrate or modify production.
on:
  push:
    branches:
      - ops/provision-reservas-dev-pages-pueblo-magico

permissions:
  contents: read

concurrency:
  group: provision-reservas-dev-pages-pueblo-magico
  cancel-in-progress: false

jobs:
  create-dev-pages:
    name: Verify exact Pages project and create only if absent
    if: github.repository == 'pueblo-magico/magico-web'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Cloudflare credentials exist
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare credentials unavailable in this repository"
            exit 1
          fi

      # The Wrangler list command can be paginated; query the exact project by name.
      - name: Query exact Cloudflare Pages project before write
        id: lookup
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/magico-reservas-dev-pueblo-magico"
          status="$(curl --silent --show-error --connect-timeout 15 --max-time 25 \
            --output "$RUNNER_TEMP/reservas-pages-before.json" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")"
          if [[ "$status" == "200" ]]; then
            node - "$RUNNER_TEMP/reservas-pages-before.json" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body.success !== true || body.result?.name !== "magico-reservas-dev-pueblo-magico") {
            throw new Error("Unexpected Cloudflare project identity; refusing any write");
          }
          console.log("Exact Pages project already exists; creation skipped.");
          NODE
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Exact Pages project not yet found; authorized to create it."
          else
            echo "::error::Unable to verify project (HTTP $status); refusing creation."
            exit 1
          fi

      - name: Create the exact Pages project via Wrangler only when absent
        if: steps.lookup.outputs.exists == 'false'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.2 pages project create \
            magico-reservas-dev-pueblo-magico --production-branch=main

      - name: Verify exact project via Cloudflare GET (no pagination)
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/magico-reservas-dev-pueblo-magico"
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --silent --show-error --connect-timeout 15 --max-time 25 \
              --output "$RUNNER_TEMP/reservas-pages-after.json" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")"
            if [[ "$status" == "200" ]]; then
              node - "$RUNNER_TEMP/reservas-pages-after.json" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const project = body.result;
          if (body.success !== true || project?.name !== "magico-reservas-dev-pueblo-magico") {
            throw new Error("Cloudflare returned a different project; abort");
          }
          console.log("Verified Pages project: " + project.name);
          console.log("Production branch: " + (project.production_branch ?? "unspecified"));
          console.log("Subdomain: " + (project.subdomain ?? "not assigned"));
          NODE
              exit 0
            fi
            if [[ "$status" != "404" ]]; then
              echo "::error::Cloudflare GET failed with HTTP $status."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Cloudflare project was not visible after creation."
          exit 1
