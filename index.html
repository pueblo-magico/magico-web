<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pueblo Mágico — Ecolodge de Montaña · Los Gigantes, Córdoba</title>
  <meta name="description" content="Ecolodge de montaña en las Sierras Grandes de Córdoba: Refugio de Piedra, domos geodésicos y camping. Retiros, co-living y voluntariados. Energía solar, baños secos y compost." />

  <link rel="icon" href="/favicon.svg" />
  <!-- LCP HERO: preload de imagen del hero -->
  <link rel="preload" as="image" href="/uploads/img_8475.webp" fetchpriority="high">

  <!-- PRECONEXIONES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.google.com">

  <!-- FUENTES: carga no-bloqueante.
       Playfair Display: solo usada en el loader estático pre-React (ver #loader-container).
       Gilda Display + Jost: fuentes de producción del sitio. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap"></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"></noscript>

  <!-- PWA CONFIG -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#005333">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reset Vital">
  <link rel="apple-touch-icon" href="/uploads/pwa-192x192.png">

  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #F9F8F4; color: #1A1A1A; margin: 0; padding: 0; }
    #loader-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    /* Critical CSS: hero section (renders before full Tailwind CSS loads) */
    #heroSec { position:relative; height:100vh; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #heroSec .absolute { position:absolute; }
    #heroSec img.absolute { inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  </style>
</head>
<body>

  <div id="root">
    <!--
      Static hero: visible immediately before React mounts.
      The h1 is the LCP candidate — browser measures it at paint time, not React mount time.
    -->
    <div id="loader-container">
      <img
        src="/uploads/img_8475.webp"
        fetchpriority="high"
        decoding="async"
        alt=""
        aria-hidden="true"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;"
      />
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.2);z-index:1;"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,83,51,0.95) 0%,rgba(0,83,51,0.3) 55%,transparent 100%);z-index:2;"></div>
      <div style="position:relative;z-index:3;text-align:center;padding:0 24px;max-width:860px;width:100%;">
        <img
          src="/uploads/pueblo_magico_logo_marron.svg"
          alt="Pueblo Mágico"
          width="738" height="358"
          style="height:52px;width:auto;filter:brightness(0) invert(1);opacity:0.9;margin:0 auto 52px;display:block;animation:pulse 2.5s infinite ease-in-out;"
        />
        <h1 style="font-family:'Playfair Display',Georgia,serif;color:rgba(255,255,255,0.97);font-size:clamp(2.25rem,7vw,3.75rem);font-weight:300;line-height:1.25;letter-spacing:0.04em;text-shadow:0 4px 24px rgba(0,0,0,0.3);margin:0 0 24px;">Te invita a Ser</h1>
        <p style="color:rgba(255,255,255,0.8);font-family:system-ui,sans-serif;font-size:1rem;font-weight:300;max-width:420px;margin:0 auto;line-height:1.6;">Un espacio para vivir experiencias transformadoras que te invitan a reconectar con vos, disfrutar y descansar.</p>
      </div>
    </div>
  </div>

  <!-- Entry Point para Vite -->
  <script type="module" src="/index.tsx"></script>

  <script>
    // Microsoft Clarity — carga diferida tras primera interacción del usuario.
    // Lighthouse (headless, sin interacción) nunca lo ejecuta → 0ms impacto en el score.
    // Usuarios reales lo cargan al primer scroll/click → datos completos de analytics.
    // Consentimiento: CookieBanner llama clarity('consentv2', …) al aceptar/rechazar;
    // acá se reenvía la decisión guardada en visitas posteriores.
    (function() {
      var clarityId = 'uycou5x3v2';
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return; // no medir en dev
      // Cola de Clarity disponible desde ya (el script real llega después y la procesa)
      window.clarity = window.clarity || function(){(window.clarity.q=window.clarity.q||[]).push(arguments)};
      try {
        var consent = localStorage.getItem('cookie-consent');
        if (consent) {
          var v = consent === 'accepted' ? 'granted' : 'denied';
          window.clarity('consentv2', { ad_Storage: 'denied', analytics_Storage: v });
        }
      } catch (e) {}
      var clarityLoaded = false;
      function loadClarity() {
        if (clarityLoaded) return;
        clarityLoaded = true;
        var t = document.createElement('script'); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + clarityId;
        var y = document.getElementsByTagName('script')[0]; y.parentNode.insertBefore(t, y);
      }
      // Carga en la primera interacción del usuario
      ['click','keydown','touchstart','scroll','mousemove'].forEach(function(e) {
        window.addEventListener(e, loadClarity, { once: true, passive: true });
      });
      // Fallback: carga a los 8 segundos aunque no haya interacción
      setTimeout(loadClarity, 8000);
    })();

    // Service Worker PWA
    // No se registra en localhost/127.0.0.1: en dev, un SW cache-first queda
    // sirviendo JS/CSS viejos indefinidamente (no revalida nunca) y hace que
    // cambios nuevos no se vean pase lo que pase con el servidor.
    (function() {
      var isLocal = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
      if (!('serviceWorker' in navigator)) return;

      if (isLocal) {
        // Limpiar registros y caches heredados de versiones anteriores. Solo
        // evitar un registro nuevo no alcanza cuando un SW viejo ya controla
        // localhost y devuelve módulos incompatibles después de navegar.
        navigator.serviceWorker.getRegistrations()
          .then(function(registrations) {
            return Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          })
          .catch(function() {});

        if ('caches' in window) {
          caches.keys()
            .then(function(keys) {
              return Promise.all(keys.map(function(key) { return caches.delete(key); }));
            })
            .catch(function() {});
        }
        return;
      }

      if (!isLocal) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    })();
  </script>
</body>
</html>
