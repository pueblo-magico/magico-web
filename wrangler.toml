name = "magico-ensueno"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "magico-ensueno-db"
database_id = "4431f6d6-052c-4f35-8fd7-4805b2d7a858"
migrations_dir = "migrations"

# Every Cloudflare Pages preview uses the shared non-production database.
# Pages supports production and preview overrides; branch-specific D1 bindings
# are intentionally not used here.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "magico-ensueno-db-preview"
database_id = "d893fa4d-96d8-49f2-a9f5-d9feb55ab0d3"
migrations_dir = "migrations"
