name = "magico-ensueno"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "magico-ensueno-db-preview"
database_id = "d893fa4d-96d8-49f2-a9f5-d9feb55ab0d3"
migrations_dir = "migrations"

[env.preview.vars]
# Pages uses this Wrangler file as the source of truth for direct-upload
# previews. The access token remains a secret configured in Cloudflare.
MP_CHECKOUT_ENABLED = "true"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "magico-ensueno-db-preview"
database_id = "d893fa4d-96d8-49f2-a9f5-d9feb55ab0d3"
migrations_dir = "migrations"

# Keep production isolated from the shared preview D1 database. Once preview
# has environment-specific vars, its D1 binding must also be explicit.
[[env.production.d1_databases]]
binding = "DB"
database_name = "magico-ensueno-db"
database_id = "4431f6d6-052c-4f35-8fd7-4805b2d7a858"
migrations_dir = "migrations"
